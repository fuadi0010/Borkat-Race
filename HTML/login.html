<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your BorkatRace account to access personalized F1 telemetry, favorite drivers, and discussion forums." />
    <meta name="theme-color" content="#0b1114" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Login - BorkatRace" />
    <meta property="og:description" content="Access your personalized Formula 1 motorsport experience on BorkatRace." />
    <meta property="og:image" content="../IMG/redbull-racing-4k.webp" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Login - BorkatRace" />
    <meta name="twitter:description" content="Access your personalized Formula 1 motorsport experience." />
    <meta name="twitter:image" content="../IMG/redbull-racing-4k.webp" />

    <link rel="icon" type="image/png" href="../IMG/f1_75-removebg-preview.png" />
    <title>Login - BorkatRace</title>
    <link rel="stylesheet" href="../CSS/style-one.css" />
    <link rel="stylesheet" href="../CSS/style-third.css" />
    <link rel="stylesheet" href="../CSS/style-responsive.css" />
  </head>
  <body>
    <!-- Site Header with Decoupled Mobile Sidebar -->
    <header class="site-header">
      <nav class="navbar" id="navbar">
        <div class="nav-container">
          <a href="../index.html" class="nav-logo" aria-label="BorkatRace Home">
            <img class="logo-f1" src="../IMG/f1_75-removebg-preview.png" alt="F1 Logo" />
          </a>
          <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="driver.html">Driver</a></li>
            <li><a href="news.html">News</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="login.html">Login</a></li>
          </ul>
          <button class="menu-toggle-btn" id="menu-toggle-btn" aria-label="Open mobile menu" aria-expanded="false">
            <img src="../IMG/menu-putih.svg" alt="Menu" />
          </button>
        </div>
      </nav>

      <!-- Mobile Sidebar Drawer (Closed by Default) -->
      <aside class="mobile-sidebar" id="mobile-sidebar" aria-hidden="true">
        <div class="sidebar-header">
          <span class="sidebar-title">Menu</span>
          <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Close mobile menu">
            <img src="../IMG/close-putih.svg" alt="Tutup" />
          </button>
        </div>
        <ul class="sidebar-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="driver.html">Driver</a></li>
          <li><a href="news.html">News</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    </header>

    <main>
      <section class="login-section">
        <div class="login-box">
          <form>
            <h2>Login</h2>
            <div class="input-box">
              <input type="email" required />
              <label>Email</label>
            </div>
            <div class="input-box">
              <input type="password" required />
              <label>Password</label>
            </div>
            <div class="remember-forget">
              <label><input type="checkbox" /> Remember me</label>
              <a href="#">Forgot password?</a>
            </div>
            <button type="submit">Sign In</button>
            <div class="register-link">
              <p>Don't have an account? <a href="#">Register</a></p>
            </div>
          </form>
        </div>
      </section>
    </main>

    <!-- Floating Back to Top Button -->
    <button class="back-to-top-btn" id="back-to-top-btn" aria-label="Back to top">↑</button>

    <footer class="footer-element">
      <p>&copy; 2003-2025 Formula One World Championship Limited. All rights reserved.</p>
    </footer>

    <script src="../JS/index.js"></script>
  </body>
</html>
